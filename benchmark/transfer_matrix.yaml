benchmark: pui89_cross_environment_transfer
source_domains: [agriculture, disaster_response, security_inspection]
target_domains: [agriculture, disaster_response, security_inspection]
protocol:
  - freeze_source_training
  - evaluate_held_out_target
  - record_hardware_and_sensor_configuration
  - inject_ood_and_sensor_failures
