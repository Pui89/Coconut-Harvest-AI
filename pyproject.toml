[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coconut-harvest-robot"
version = "0.2.0"
description = "Multimodal, safety-controlled coconut harvesting robotics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=13.0.0,<14.0",
  "numpy>=1.24.0",
  "transformers>=5.14.0,<6.0.0",
  "accelerate>=1.10.0",
  "huggingface-hub>=1.32.0,<2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.15.0,<3.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["apps"]
testpaths = ["tests"]
addopts = "-q"
