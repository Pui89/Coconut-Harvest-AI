name: PUI89 Portfolio Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/pui89-portfolio-monitor.yml"
      - "scripts/pui89_portfolio_monitor.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pui89-portfolio-monitor.yml"
      - "scripts/pui89_portfolio_monitor.py"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pui89-portfolio-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-snapshot:
    name: Read-only three-project status snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out monitor
        uses: actions/checkout@v7

      - name: Generate portfolio snapshot
        run: python3 scripts/pui89_portfolio_monitor.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Upload JSON and Markdown report
        uses: actions/upload-artifact@v7
        with:
          name: pui89-portfolio-status-${{ github.run_number }}
          path: portfolio-status/
          if-no-files-found: error
          retention-days: 30
