name: Free helper review (Ruff)

on:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/free-helper-review.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/free-helper-review.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  ruff-review:
    name: Ruff lint review (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free open-source Ruff linter
        run: python -m pip install --disable-pip-version-check ruff
      - name: Report Python lint findings
        continue-on-error: true
        run: ruff check . --output-format=github
