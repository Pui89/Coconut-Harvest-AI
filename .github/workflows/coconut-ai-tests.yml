name: Coconut AI regression tests

on:
  push:
    branches: [main]
    paths:
      - "apps/pui89_app/local_detector.py"
      - "apps/pui89_app/local_first_pipeline.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/coconut-ai-tests.yml"
  pull_request:
    paths:
      - "apps/pui89_app/local_detector.py"
      - "apps/pui89_app/local_first_pipeline.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/coconut-ai-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run focused safety and detector tests
        run: python -m pytest tests/test_coconut_safety_pipeline.py tests/test_local_detector.py -q
