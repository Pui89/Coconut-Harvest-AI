name: Local detector adapter tests

on:
  pull_request:
    paths:
      - "apps/pui89_app/local_detector.py"
      - "apps/pui89_app/test_local_detector.py"
      - "apps/pui89_app/web_demo.py"
      - ".github/workflows/local-detector-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-detector-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check Python syntax
        run: python -m compileall -q apps/pui89_app
      - name: Run local detector adapter tests
        run: python -m pytest -q apps/pui89_app/test_local_detector.py
