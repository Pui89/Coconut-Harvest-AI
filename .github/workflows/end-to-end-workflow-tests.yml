name: End-to-end robot workflow tests

on:
  pull_request:
    paths:
      - "apps/pui89_app/robot_workflow.py"
      - "apps/pui89_app/run_robot_workflow.py"
      - "apps/pui89_app/web_demo.py"
      - "apps/pui89_app/test_robot_workflow.py"
      - "apps/pui89_app/iou_tracker.py"
      - "apps/pui89_app/rgbd_localization.py"
      - "apps/pui89_app/test_spatial_tracking.py"
      - "examples/end_to_end_robot_workflow.example.json"
      - ".github/workflows/end-to-end-workflow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q apps/pui89_app
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run workflow tests
        run: python -m pytest -q apps/pui89_app/test_robot_workflow.py apps/pui89_app/test_spatial_tracking.py
