name: PUI89 System Guardrails

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pui89-system-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-risk-preflight:
    name: Workflow privilege and supply-chain preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit workflow privilege hazards
        run: python scripts/pui89_guardrail_audit.py

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pui89-system-guardrail-report
          path: pui89-guardrail-report.json
          if-no-files-found: warn
          retention-days: 30
