name: PUI89 application CI

on:
  pull_request:
    paths:
      - "apps/pui89_app/**"
      - "docs/END_TO_END_ROBOT_WORKFLOW.md"
      - ".github/workflows/pui89-application-ci.yml"
      - ".github/workflows/end-to-end-workflow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r apps/pui89_app/requirements.txt
      - name: Install lightweight test dependencies
        run: python -m pip install numpy pytest
      - name: Compile Python files
        run: python -m compileall -q apps/pui89_app benchmarks
      - name: Run focused AI and robot workflow tests
        run: python -m pytest -q apps/pui89_app/test_robot_workflow.py apps/pui89_app/test_spatial_tracking.py apps/pui89_app/test_local_detector.py apps/pui89_app/test_local_first_pipeline.py apps/pui89_app/test_vision_to_workflow.py apps/pui89_app/test_local_to_simulation.py
      - name: Run application tests
        run: python -m unittest discover -s apps/pui89_app -p 'test_*.py' -v
      - name: Check benchmark validator
        run: python benchmarks/validate_results.py --self-test
