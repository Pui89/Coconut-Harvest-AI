name: PUI89 Shared Intelligence Contract
on:
  pull_request:
    paths:
      - "schemas/pui89-intelligence-report.schema.json"
      - "docs/PUI89_SHARED_INTELLIGENCE_WORKFLOW.md"
      - "tests/test_pui89_shared_workflow_contract.py"
      - ".github/workflows/pui89-shared-intelligence-contract.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON syntax
        run: python -c "import json; json.load(open('schemas/pui89-intelligence-report.schema.json', encoding='utf-8'))"
      - name: Run dependency-free contract tests
        run: python -m unittest discover -s tests -p 'test_pui89_shared_workflow_contract.py' -v
