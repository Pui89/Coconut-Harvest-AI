name: tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install official CPU-only PyTorch
        run: python -m pip install -r requirements-cpu-torch.txt
      - name: Install project and development dependencies
        run: python -m pip install -e ".[torch,dev]"
      - name: Run test suite
        run: python -m pytest -q
