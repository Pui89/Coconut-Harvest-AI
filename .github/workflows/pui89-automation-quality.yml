name: PUI89 Automated Repository Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pui89-quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pui89-quality:
    name: Read-only PUI89 repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out product repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Clone pinned public PUI89 audit tool
        run: |
          git clone --depth 1 --no-tags --single-branch --branch feat/pui89-automation-core-v1 \
            https://github.com/Pui89/PUI89-Shared-AI-Core.git "$RUNNER_TEMP/pui89-core"
          test "$(git -C "$RUNNER_TEMP/pui89-core" rev-parse HEAD)" = "f22d9e5e50e56d45bab456750e01c3da6dd75652"

      - name: Test the shared audit tool
        run: python3 -m unittest discover -s "$RUNNER_TEMP/pui89-core/tests" -p 'test_pui89_automation_audit.py' -v

      - name: Run read-only repository audit
        run: |
          python3 "$RUNNER_TEMP/pui89-core/tools/pui89_automation_audit.py" \
            --root . \
            --json-out "$RUNNER_TEMP/pui89-repository-audit.json" \
            --summary "$GITHUB_STEP_SUMMARY"
