name: YOLOv8 and YOLO11 Hosted Smoke Test

on:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/yolo-hosted-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yolo-hosted-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inference-smoke-test:
    name: CPU inference smoke test (not coconut accuracy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ultralytics
        run: python -m pip install --upgrade pip ultralytics

      - name: Download public demonstration image
        run: |
          python - <<'PY'
          from urllib.request import urlretrieve
          urlretrieve("https://ultralytics.com/images/bus.jpg", "bus.jpg")
          print("Downloaded public Ultralytics demo image for generic inference smoke test.")
          PY

      - name: Run YOLOv8n and YOLO11n inference
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from ultralytics import YOLO

          image = "bus.jpg"
          results_report = {
              "purpose": "Hosted generic object-detection inference smoke test",
              "environment": "GitHub-hosted Ubuntu CPU runner",
              "image": "Ultralytics public bus demo image; not a coconut dataset",
              "warning": "This does not measure coconut detection accuracy or establish orchard readiness.",
              "models": [],
          }

          for model_name in ("yolov8n.pt", "yolo11n.pt"):
              model = YOLO(model_name)
              start = time.perf_counter()
              prediction = model.predict(source=image, device="cpu", verbose=False)
              elapsed_ms = (time.perf_counter() - start) * 1000
              result = prediction[0]
              names = result.names
              detections = []
              for box in result.boxes:
                  class_id = int(box.cls.item())
                  detections.append({
                      "class_id": class_id,
                      "class_name": names[class_id],
                      "confidence": round(float(box.conf.item()), 5),
                      "xyxy": [round(float(v), 2) for v in box.xyxy[0].tolist()],
                  })
              results_report["models"].append({
                  "model": model_name,
                  "inference_ms_including_first_prediction": round(elapsed_ms, 2),
                  "detection_count": len(detections),
                  "detections": detections,
              })
              print(f"{model_name}: inference OK; {len(detections)} detections; {elapsed_ms:.2f} ms")
          
          Path("yolo-hosted-smoke-test.json").write_text(
              json.dumps(results_report, indent=2), encoding="utf-8"
          )
          print(json.dumps(results_report, indent=2))
          PY

      - name: Upload inference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo-hosted-smoke-test-report
          path: yolo-hosted-smoke-test.json
          if-no-files-found: ignore
          retention-days: 7
