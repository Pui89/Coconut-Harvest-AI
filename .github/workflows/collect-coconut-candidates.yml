name: Collect free coconut image candidates

on:
  schedule:
    - cron: "13 6 * * 1"
  push:
    paths:
      - ".github/workflows/collect-coconut-candidates.yml"
      - "tools/collect_commons_coconuts.py"
      - "tools/requirements-data.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install -r tools/requirements-data.txt

      - name: Collect up to 30 openly licensed candidates
        run: python tools/collect_commons_coconuts.py --out data/commons_candidates --limit 30 --max-mb 8 --pause 0.5

      - name: Build review gallery
        run: python tools/build_candidate_gallery.py --collection-dir data/commons_candidates

      - name: Upload candidate images and provenance for review
        uses: actions/upload-artifact@v4
        with:
          name: coconut-image-candidates
          path: data/commons_candidates/
          if-no-files-found: error
          retention-days: 7
