name: Fault monitor tests

on:
  push:
    paths:
      - "apps/pui89_safety/**"
      - "tests/test_fault_monitor.py"
      - ".github/workflows/fault-monitor-tests.yml"
  pull_request:
    paths:
      - "apps/pui89_safety/**"
      - "tests/test_fault_monitor.py"
      - ".github/workflows/fault-monitor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run fault monitor tests
        env:
          PYTHONPATH: apps
        run: python -m pytest tests/test_fault_monitor.py -q
