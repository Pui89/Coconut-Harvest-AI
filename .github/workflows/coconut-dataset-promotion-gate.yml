name: Coconut dataset promotion gate

on:
  push:
    paths:
      - "tools/coconut_dataset_promotion_gate.py"
      - "tests/test_coconut_dataset_promotion_gate.py"
      - "data/review_batch_2026-10-18/source_rights_audit_2026-10-19.csv"
      - "data/review_batch_2026-10-18/candidate_review_2026-10-18.csv"
      - ".github/workflows/coconut-dataset-promotion-gate.yml"
  pull_request:
    paths:
      - "tools/coconut_dataset_promotion_gate.py"
      - "tests/test_coconut_dataset_promotion_gate.py"
      - "data/review_batch_2026-10-18/source_rights_audit_2026-10-19.csv"
      - "data/review_batch_2026-10-18/candidate_review_2026-10-18.csv"
      - ".github/workflows/coconut-dataset-promotion-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run promotion-gate unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_coconut_dataset_promotion_gate.py
      - name: Audit current candidate batch (expected to remain blocked until review is complete)
        id: promotion_gate
        continue-on-error: true
        run: |
          python tools/coconut_dataset_promotion_gate.py \
            --rights-csv data/review_batch_2026-10-18/source_rights_audit_2026-10-19.csv \
            --review-csv data/review_batch_2026-10-18/candidate_review_2026-10-18.csv \
            --output dataset-promotion-report.json

      - name: Validate blocked-state JSON report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("dataset-promotion-report.json")
          if not report_path.is_file():
              raise SystemExit("Promotion gate did not produce a JSON report")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          assert report["candidate_count"] > 0, "No candidate records were evaluated"
          assert report["ready_for_training"] is False, "Batch unexpectedly became training-ready"
          assert report["blocked_count"] > 0, "Expected at least one candidate to remain blocked"
          assert report["errors"] == [], f"Ledger structure errors: {report['errors']}"
          print(
              f"Blocked-state report valid: {report['blocked_count']} blocked, "
              f"{report['eligible_count']} individually eligible, no ledger structure errors."
          )
          PY
