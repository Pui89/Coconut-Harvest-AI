name: Download replacement coconut image candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-replacement-coconut-images.yml"
      - "scripts/download_replacement_coconut_images.py"
      - "scripts/download_clean_replacement_candidates.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download candidates and verify source checksums
        run: python scripts/download_clean_replacement_candidates.py

      - name: Upload verified candidate files for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coconut-clean-replacement-candidates
          path: data/review_batch_2026-10-19/images/
          if-no-files-found: warn
          retention-days: 5
