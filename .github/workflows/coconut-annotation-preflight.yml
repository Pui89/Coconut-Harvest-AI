name: Coconut annotation geometry audit

on:
  push:
    branches: [main]
    paths:
      - "tools/audit_coconut_annotations.py"
      - "data/review_batch_2026-10-18/annotations_ARCHIVE_v0.1_NOT_FOR_TRAINING.json"
      - ".github/workflows/coconut-annotation-preflight.yml"
  pull_request:
    paths:
      - "tools/audit_coconut_annotations.py"
      - "data/review_batch_2026-10-18/annotations_ARCHIVE_v0.1_NOT_FOR_TRAINING.json"
      - ".github/workflows/coconut-annotation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annotation-geometry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit archived annotation geometry
        run: |
          mkdir -p audit-artifacts
          python tools/audit_coconut_annotations.py \
            --annotations data/review_batch_2026-10-18/annotations_ARCHIVE_v0.1_NOT_FOR_TRAINING.json \
            --output audit-artifacts/annotation-geometry-audit.json

      - name: Upload geometry audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coconut-annotation-geometry-audit
          path: audit-artifacts/annotation-geometry-audit.json
          if-no-files-found: warn
          retention-days: 14
