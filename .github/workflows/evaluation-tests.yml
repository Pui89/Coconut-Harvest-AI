name: Evaluation tool tests

on:
  pull_request:
    paths:
      - "scripts/evaluate_coconut_detections.py"
      - "tests/test_detection_evaluation.py"
      - ".github/workflows/evaluation-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/evaluate_coconut_detections.py"
      - "tests/test_detection_evaluation.py"
      - ".github/workflows/evaluation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run evaluator tests
        run: python -m pytest -q tests/test_detection_evaluation.py
