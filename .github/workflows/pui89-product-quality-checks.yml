name: PUI89 Product Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  product-regression-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run standard-library regression tests
        run: python3 -m unittest discover -s tests -p test_pui89_failure_scenarios.py -v
