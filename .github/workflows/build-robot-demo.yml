name: Build 3D Coconut Robot Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib trimesh imageio
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python sim/coconut_harvester_demo.py
      - uses: actions/upload-artifact@v7
        with:
          name: coconut-harvester-3d-demo
          path: |
            sim/assets/coconut_harvester_3d.glb
            sim/assets/coconut_harvester_demo.mp4
