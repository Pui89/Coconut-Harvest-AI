name: PUI89 Free Local Checks

on:
  push:
    paths:
      - "pui89_autonomy/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pui89-free-checks.yml"
  pull_request:
    paths:
      - "pui89_autonomy/**"
      - "tests/**"
      - "tools/**"
      - "scripts/pui89_project_health_check.py"
      - ".github/workflows/pui89-free-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-library-checks:
    name: No-download safety and interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check autonomy supervisor
        run: python -m unittest discover -s tests -p "test_autonomy_supervisor.py" -v
      - name: Check vision and action-plan contracts
        run: python -m unittest discover -s tests -p "test_llm_interfaces.py" -v
      - name: Check free-first project-specific validators
        run: python -m unittest discover -s tests -p "test_free_first_project_tools.py" -v
      - name: Test offline audit utility (stdlib runner)
        run: |
          python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path("tests/test_free_first_audit.py")
          spec = importlib.util.spec_from_file_location("free_first_audit_tests", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = [
              module.test_audit_is_offline_and_hashes_small_dataset_files,
              module.test_audit_reports_python_syntax_errors_without_installing_anything,
              module.test_audit_skips_virtual_environment_files,
          ]
          for test in tests:
              with tempfile.TemporaryDirectory() as directory:
                  test(Path(directory))
              print(f"PASS: {test.__name__}")
          PY
      - name: Check world state unit tests
        run: python -m unittest discover -s tests -p "test_world_state.py" -v
      - name: Check reproducible experiment reports
        run: python -m unittest discover -s tests -p "test_experiment_report.py" -v
      - name: Compile Python files without importing optional dependencies
        run: python -m compileall -q pui89_autonomy scripts tests tools
      - name: Check project Python syntax and repository structure
        run: python scripts/pui89_project_health_check.py
      - name: Record scope limits
        run: |
          echo "## PUI89 Free Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Standard-library tests and Python syntax checks only." >> "$GITHUB_STEP_SUMMARY"
          echo "- No model downloads, paid APIs, cloud GPU, or hardware commands." >> "$GITHUB_STEP_SUMMARY"
          echo "- Passing checks do not establish field performance or physical robot safety." >> "$GITHUB_STEP_SUMMARY"
