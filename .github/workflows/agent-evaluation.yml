name: Synthetic agent evaluation

# Keep only the newest run for a branch; branch pushes are covered by PR CI.
concurrency:
  group: synthetic-eval-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "agents/agentic_workflow.py"
      - "agents/project_agent.py"
      - "tools/evaluate_agentic_workflow.py"
      - "tests/test_evaluate_agentic_workflow.py"
      - "tests/test_agentic_workflow_stress.py"
      - "examples/agentic_workflow.evaluation.json"
      - "docs/AGENT_EVALUATION_PROTOCOL.md"
      - ".github/workflows/agent-evaluation.yml"
  pull_request:
    paths:
      - "agents/agentic_workflow.py"
      - "agents/project_agent.py"
      - "tools/evaluate_agentic_workflow.py"
      - "tests/test_evaluate_agentic_workflow.py"
      - "examples/agentic_workflow.evaluation.json"
      - "docs/AGENT_EVALUATION_PROTOCOL.md"
      - ".github/workflows/agent-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-agent-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run evaluation-harness unit tests (standard library only)
        run: |
          python -m unittest discover -s tests -p "test_evaluate_agentic_workflow.py"
          python -m unittest discover -s tests -p "test_agentic_workflow_stress.py"
      - name: Evaluate labelled synthetic scenarios
        run: python -m tools.evaluate_agentic_workflow --input examples/agentic_workflow.evaluation.json --output evaluation-report.json
      - name: Upload synthetic report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-agent-evaluation-python-${{ matrix.python-version }}
          path: evaluation-report.json
          if-no-files-found: error
          retention-days: 14
