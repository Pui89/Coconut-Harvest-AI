name: Permissive-License Detector Smoke Test

on:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/permissive-detector-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permissive-detector-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtdetr-smoke-test:
    name: LibreYOLO RT-DETR CPU inference (not coconut accuracy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreYOLO
        run: python -m pip install --upgrade pip libreyolo

      - name: Download public demonstration image
        run: |
          python - <<'PY'
          from urllib.request import urlretrieve
          urlretrieve("https://ultralytics.com/images/bus.jpg", "bus.jpg")
          print("Downloaded public demo image; this is not a coconut dataset.")
          PY

      - name: Run Apache-2.0 RT-DETR checkpoint smoke test
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from libreyolo import LibreYOLO

          report = {
              "purpose": "Generic object-detection smoke test for a permissive-license alternative",
              "model": "LibreRTDETRr18.pt",
              "model_family": "RT-DETR via LibreYOLO",
              "license_note": "LibreYOLO documentation lists RT-DETR code and weights as Apache-2.0; retain upstream notices and verify the exact checkpoint's license before commercial redistribution.",
              "image": "Public bus demonstration image; not a coconut dataset",
              "warning": "This test does not measure coconut detection accuracy or establish orchard/robot readiness.",
          }
          model = LibreYOLO("LibreRTDETRr18.pt")
          start = time.perf_counter()
          result = model("bus.jpg")
          elapsed_ms = (time.perf_counter() - start) * 1000
          detections = []
          for box in result.boxes:
              class_id = int(box.cls.item())
              names = result.names
              detections.append({
                  "class_id": class_id,
                  "class_name": names[class_id] if isinstance(names, dict) else names[class_id],
                  "confidence": round(float(box.conf.item()), 5),
                  "xyxy": [round(float(v), 2) for v in box.xyxy[0].tolist()],
              })
          report["inference_ms_including_first_prediction"] = round(elapsed_ms, 2)
          report["detection_count"] = len(detections)
          report["detections"] = detections
          Path("permissive-detector-smoke-test.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permissive-detector-smoke-test-report
          path: permissive-detector-smoke-test.json
          if-no-files-found: ignore
          retention-days: 7
