name: Fetch coconut image candidates

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_coconut_candidates.py"
      - ".github/workflows/fetch-coconut-candidates.yml"
  schedule:
    # Weekly candidate refresh; local-time equivalent is 09:25 Thailand on Mondays.
    - cron: "25 2 * * 1"

permissions:
  contents: read

jobs:
  fetch-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch allowlisted image candidates and current licence metadata
        run: python tools/fetch_coconut_candidates.py --download
      - name: Upload review-only candidates and provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coconut-candidate-images-and-provenance
          path: data/candidate_images/
          if-no-files-found: warn
          retention-days: 14
