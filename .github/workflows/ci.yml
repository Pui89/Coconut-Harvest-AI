name: Python tests

on:
  schedule:
    - cron: "17 5 * * 0" # Weekly Sunday check; UTC
  push:
    paths:
      - "src/**"
      - "apps/pui89_app/**"
      - "tests/**"
      - "training/**"
      - "tools/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "apps/pui89_app/**"
      - "tests/**"
      - "training/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest --junitxml=pytest-results.xml

      - name: Publish test totals to workflow summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-results.xml")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report.exists():
              summary.write_text("## Automated test report\n\nPytest did not produce a report. Check the test-step logs.\n", encoding="utf-8")
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              tests = sum(int(s.get("tests", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              errors = sum(int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              summary.write_text(
                  "## Automated test report\n\n"
                  f"- Tests: **{tests}**\n- Failures: **{failures}**\n"
                  f"- Errors: **{errors}**\n- Skipped: **{skipped}**\n\n"
                  "This report covers software tests only; it does not validate physical robot safety or field performance.\n",
                  encoding="utf-8",
              )
          PY
