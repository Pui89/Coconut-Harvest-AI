name: PUI89 Pitfall Detector Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run Pitfall Detector tests
        run: |
          if [ -f tests/test_pitfall_detector.py ]; then
            python -m unittest discover -s tests -p "test_pitfall_detector.py" -v
          else
            echo "ERROR: tests/test_pitfall_detector.py is missing"
            exit 1
          fi
