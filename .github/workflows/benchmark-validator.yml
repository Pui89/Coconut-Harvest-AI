name: Benchmark report validator

on:
  push:
    paths:
      - "benchmarks/validate_results.py"
      - "tools/validate_benchmark_report.py"
      - "tests/test_benchmark_report_validator.py"
      - "tests/test_jsonl_benchmark_validator.py"
      - ".github/workflows/benchmark-validator.yml"
  pull_request:
    paths:
      - "benchmarks/validate_results.py"
      - "tools/validate_benchmark_report.py"
      - "tests/test_benchmark_report_validator.py"
      - "tests/test_jsonl_benchmark_validator.py"
      - ".github/workflows/benchmark-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Test both benchmark validators
        run: python -m pytest -q tests/test_benchmark_report_validator.py tests/test_jsonl_benchmark_validator.py
      - name: Run JSONL validator self-test
        run: python benchmarks/validate_results.py --self-test
