name: Dependency Licence Governance

on:
  push:
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - "apps/**/requirements*.txt"
      - "tools/requirements*.txt"
      - "scripts/check_dependency_licenses.py"
      - ".github/workflows/dependency-licence-governance.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - "apps/**/requirements*.txt"
      - "tools/requirements*.txt"
      - "scripts/check_dependency_licenses.py"
      - ".github/workflows/dependency-licence-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-licence-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: CPU-first dependency licence audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install the CPU wheel first so the audit does not pull CUDA/NVSHMEM
      # runtime packages merely to inspect the project's declared Python stack.
      - name: Install CPU-only PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch>=2.13.0"

      - name: Install declared project dependencies and licence reporter
        run: |
          python -m pip install --disable-pip-version-check -e . pip-licenses
          python -m pip install --disable-pip-version-check \
            -r apps/pui89_app/requirements.txt \
            -r apps/pui89_app/requirements-detector.txt \
            -r tools/requirements-data.txt

      - name: Generate installed dependency licence report
        run: pip-licenses --format=json > dependency-licences.json

      - name: Enforce licence metadata policy
        run: python scripts/check_dependency_licenses.py dependency-licences.json

      - name: Upload licence inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licence-inventory
          path: dependency-licences.json
          if-no-files-found: warn
          retention-days: 30
