name: Build Cinematic 3D Coconut Robot Video
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Render cinematic 3D/4D demo
        run: python sim/cinematic_demo.py
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: coconut-harvest-robot-cinematic-3d-4d
          path: artifacts/coconut_harvest_robot_cinematic_3d_4d.mp4
