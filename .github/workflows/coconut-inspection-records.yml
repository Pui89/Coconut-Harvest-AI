name: Coconut Inspection Records Tests

on:
  pull_request:
    paths:
      - "apps/pui89_app/inspection_records.py"
      - "apps/pui89_app/test_inspection_records.py"
      - "apps/pui89_app/requirements.txt"
      - "apps/pui89_app/web_demo.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "tools/requirements-data.txt"
      - "docs/COCONUT_INSPECTION_RECORDS_V1.md"
      - ".github/workflows/coconut-inspection-records.yml"
  push:
    paths:
      - "apps/pui89_app/inspection_records.py"
      - "apps/pui89_app/test_inspection_records.py"
      - "apps/pui89_app/requirements.txt"
      - "apps/pui89_app/web_demo.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "tools/requirements-data.txt"
      - "docs/COCONUT_INSPECTION_RECORDS_V1.md"
      - ".github/workflows/coconut-inspection-records.yml"

permissions:
  contents: read

concurrency:
  group: coconut-inspection-records-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspection-records:
    name: Local inspection record regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install supported image-decoding dependency
        run: python -m pip install "Pillow>=13.0.0,<14.0"

      - name: Run focused inspection record tests
        env:
          PYTHONPATH: .
        run: python -m unittest apps.pui89_app.test_inspection_records -v
