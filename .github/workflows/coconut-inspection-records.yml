name: Coconut Inspection Records Tests

on:
  pull_request:
    paths:
      - "apps/pui89_app/inspection_records.py"
      - "apps/pui89_app/test_inspection_records.py"
      - "apps/pui89_app/requirements.txt"
      - "apps/pui89_app/main.py"
      - "apps/pui89_app/web_demo.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "tools/requirements-data.txt"
      - "docs/COCONUT_INSPECTION_RECORDS_V1.md"
      - ".github/workflows/coconut-inspection-records.yml"
  push:
    paths:
      - "apps/pui89_app/inspection_records.py"
      - "apps/pui89_app/test_inspection_records.py"
      - "apps/pui89_app/requirements.txt"
      - "apps/pui89_app/main.py"
      - "apps/pui89_app/web_demo.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "tools/requirements-data.txt"
      - "docs/COCONUT_INSPECTION_RECORDS_V1.md"
      - ".github/workflows/coconut-inspection-records.yml"

permissions:
  contents: read

concurrency:
  group: coconut-inspection-records-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspection-records:
    name: App dependency and inspection regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install app dependencies from the committed manifest
        run: python -m pip install -r apps/pui89_app/requirements.txt

      - name: Verify patched FastAPI and Starlette versions
        run: |
          python - <<'PY'
          import starlette
          import fastapi
          from apps.pui89_app.main import app
          from packaging.version import Version

          assert Version(starlette.__version__) >= Version("1.3.1")
          assert Version(starlette.__version__) < Version("1.4")
          assert Version(fastapi.__version__) >= Version("0.137.2")
          assert Version(fastapi.__version__) < Version("0.138")
          assert app is not None
          print(f"FastAPI {fastapi.__version__}; Starlette {starlette.__version__}")
          PY

      - name: Run focused inspection record tests
        env:
          PYTHONPATH: .
        run: python -m unittest apps.pui89_app.test_inspection_records -v
