name: security
on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "SECURITY.md"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "SECURITY.md"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check for private keys and common token patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -I -E 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16}' --exclude-dir=.git .; then
            echo "Potential secret material detected."
            exit 1
          fi

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install security tooling
        run: python -m pip install --disable-pip-version-check pip-audit bandit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Static security analysis
        run: bandit -r src -ll

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, actions
      - uses: github/codeql-action/analyze@v4
