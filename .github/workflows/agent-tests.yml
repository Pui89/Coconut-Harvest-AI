name: Agent unit tests

on:
  push:
    paths:
      - "agents/**"
      - "tests/test_project_agent.py"
      - "tests/test_evaluate_coconut_detections.py"
      - "tests/test_annotations_to_ground_truth_csv.py"
      - "tools/evaluate_coconut_detections.py"
      - "tools/annotations_to_ground_truth_csv.py"
      - ".github/workflows/agent-tests.yml"
  pull_request:
    paths:
      - "agents/**"
      - "tests/test_project_agent.py"
      - "tests/test_evaluate_coconut_detections.py"
      - "tests/test_annotations_to_ground_truth_csv.py"
      - "tools/evaluate_coconut_detections.py"
      - "tools/annotations_to_ground_truth_csv.py"
      - ".github/workflows/agent-tests.yml"
  workflow_dispatch:
  schedule:
    # Weekly regression check; no model downloads or paid services.
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax-check agent and tests
        run: python -m py_compile agents/project_agent.py tests/test_project_agent.py tools/evaluate_coconut_detections.py tests/test_evaluate_coconut_detections.py tools/annotations_to_ground_truth_csv.py tests/test_annotations_to_ground_truth_csv.py
      - name: Run agent unit tests
        run: python -m pytest -q tests/test_project_agent.py tests/test_evaluate_coconut_detections.py tests/test_annotations_to_ground_truth_csv.py
