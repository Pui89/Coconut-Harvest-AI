name: Agent unit tests

on:
  push:
    paths:
      - "agents/**"
      - "tests/test_project_agent.py"
      - "tests/test_evaluate_coconut_detections.py"
      - "tests/test_annotations_to_ground_truth_csv.py"
      - "tests/test_audit_coconut_dataset.py"
      - "tests/test_coconut_dataset_promotion_gate.py"
      - "tests/test_audit_coconut_annotation_provenance.py"
      - "tests/test_record_coconut_source_hash.py"
      - "tests/test_coconut_annotator_provenance_contract.py"
      - "tools/coconut_annotator.html"
      - "tools/evaluate_coconut_detections.py"
      - "tools/annotations_to_ground_truth_csv.py"
      - "tools/fetch_coconut_candidates.py"
      - "tools/audit_coconut_dataset.py"
      - "tools/coconut_dataset_promotion_gate.py"
      - "tools/audit_coconut_annotation_provenance.py"
      - "tools/record_coconut_source_hash.py"
      - "data/review_batch_2026-10-18/source_rights_audit_2026-10-19.csv"
      - "data/review_batch_2026-10-18/candidate_review_2026-10-18.csv"
      - "docs/COCONUT_DATASET_READINESS.md"
      - ".github/workflows/fetch-coconut-candidates.yml"
      - ".github/workflows/agent-tests.yml"
      - "docs/AI_AGENT_REVIEW_PLAN.md"
      - "docs/STEP_BY_STEP_TESTING.md"
  pull_request:
    paths:
      - "agents/**"
      - "tests/test_project_agent.py"
      - "tests/test_evaluate_coconut_detections.py"
      - "tests/test_annotations_to_ground_truth_csv.py"
      - "tests/test_audit_coconut_dataset.py"
      - "tests/test_coconut_dataset_promotion_gate.py"
      - "tests/test_audit_coconut_annotation_provenance.py"
      - "tests/test_record_coconut_source_hash.py"
      - "tests/test_coconut_annotator_provenance_contract.py"
      - "tools/coconut_annotator.html"
      - "tools/evaluate_coconut_detections.py"
      - "tools/annotations_to_ground_truth_csv.py"
      - "tools/fetch_coconut_candidates.py"
      - "tools/audit_coconut_dataset.py"
      - "tools/coconut_dataset_promotion_gate.py"
      - "tools/audit_coconut_annotation_provenance.py"
      - "tools/record_coconut_source_hash.py"
      - "data/review_batch_2026-10-18/source_rights_audit_2026-10-19.csv"
      - "data/review_batch_2026-10-18/candidate_review_2026-10-18.csv"
      - "docs/COCONUT_DATASET_READINESS.md"
      - ".github/workflows/fetch-coconut-candidates.yml"
      - ".github/workflows/agent-tests.yml"
      - "docs/AI_AGENT_REVIEW_PLAN.md"
      - "docs/STEP_BY_STEP_TESTING.md"
  workflow_dispatch:
  schedule:
    # Weekly regression check; no model downloads or paid services.
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax-check agent and tests
        run: python -m py_compile agents/project_agent.py tests/test_project_agent.py tools/coconut_dataset_promotion_gate.py tests/test_coconut_dataset_promotion_gate.py tools/audit_coconut_annotation_provenance.py tests/test_audit_coconut_annotation_provenance.py tools/record_coconut_source_hash.py tests/test_record_coconut_source_hash.py tests/test_coconut_annotator_provenance_contract.py tools/evaluate_coconut_detections.py tests/test_evaluate_coconut_detections.py tools/annotations_to_ground_truth_csv.py tests/test_annotations_to_ground_truth_csv.py tools/fetch_coconut_candidates.py tools/audit_coconut_dataset.py
      - name: Run agent unit tests
        run: python -m pytest -q tests/test_project_agent.py tests/test_coconut_dataset_promotion_gate.py tests/test_audit_coconut_annotation_provenance.py tests/test_record_coconut_source_hash.py tests/test_coconut_annotator_provenance_contract.py tests/test_evaluate_coconut_detections.py tests/test_annotations_to_ground_truth_csv.py tests/test_audit_coconut_dataset.py

  dataset-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate the dataset promotion gate without promoting data
        id: readiness
        shell: bash
        run: |
          mkdir -p reports
          if python tools/coconut_dataset_promotion_gate.py \
            --rights-csv data/review_batch_2026-10-18/source_rights_audit_2026-10-19.csv \
            --review-csv data/review_batch_2026-10-18/candidate_review_2026-10-18.csv \
            --output reports/coconut-dataset-readiness.json; then
            echo "result=ready" >> "$GITHUB_OUTPUT"
            echo "Dataset promotion gate: ready (recorded fields only; manual rights/label review still required)."
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "result=blocked" >> "$GITHUB_OUTPUT"
              echo "Dataset remains blocked. See the JSON report artifact; this is an expected readiness status, not a CI test failure."
            else
              echo "Dataset promotion gate could not run (exit $status)." >&2
              exit "$status"
            fi
          fi
      - name: Upload dataset readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coconut-dataset-readiness
          path: reports/coconut-dataset-readiness.json
          if-no-files-found: error
          retention-days: 14
