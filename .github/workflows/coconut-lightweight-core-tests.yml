name: Coconut Lightweight Core Tests

on:
  push:
    paths:
      - "pui89_core/**"
      - "pui89_autonomy/**"
      - "tools/pui89_world_state.py"
      - "tests/test_pui89_core_contracts.py"
      - "tests/test_pui89_world_state.py"
      - "tests/test_world_state.py"
      - ".github/workflows/coconut-lightweight-core-tests.yml"
  pull_request:
    paths:
      - "pui89_core/**"
      - "pui89_autonomy/**"
      - "tools/pui89_world_state.py"
      - "tests/test_pui89_core_contracts.py"
      - "tests/test_pui89_world_state.py"
      - "tests/test_world_state.py"
      - ".github/workflows/coconut-lightweight-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coconut-lightweight-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Dependency-light core contracts
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner only
        run: python -m pip install pytest
      - name: Run dependency-light contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_pui89_core_contracts.py \
            tests/test_pui89_world_state.py \
            tests/test_world_state.py
