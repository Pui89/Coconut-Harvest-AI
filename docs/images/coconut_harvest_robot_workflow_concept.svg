<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Coconut Harvest AI robot concept workflow</title>
<desc id="desc">Illustrative concept showing a sensor-equipped ground robot with a telescopic mast and guarded harvesting arm near a coconut palm, connected to stages for sensing, target assessment, safety checking, and supervised harvesting. This is a concept, not a tested robot.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff2fb"/><stop offset="1" stop-color="#f7fbec"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3e8d59"/><stop offset="1" stop-color="#165b43"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6a83c"/><stop offset="1" stop-color="#cf6a1a"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#153044" flood-opacity=".15"/></filter>
</defs>
<rect width="1400" height="860" rx="28" fill="#f5f8f6"/>
