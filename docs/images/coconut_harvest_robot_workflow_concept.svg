</g>
<g fill="#1d4d5b" font-size="19" font-weight="700"><text x="88" y="650">1. SENSE</text><text x="404" y="650">2. ASSESS</text><text x="720" y="650">3. PLAN SAFELY</text><text x="1036" y="650">4. SUPERVISE</text></g>
<g fill="#46676c" font-size="15">
<text x="88" y="680"><tspan x="88" dy="0">Camera / depth sensor</tspan><tspan x="88" dy="22">observe canopy and fruit</tspan></text>
<text x="404" y="680"><tspan x="404" dy="0">Propose target location,</tspan><tspan x="404" dy="22">uncertainty and maturity</tspan></text>
<text x="720" y="680"><tspan x="720" dy="0">Check reach, collisions,</tspan><tspan x="720" dy="22">clearance and safe hold</tspan></text>
<text x="1036" y="680"><tspan x="1036" dy="0">Human authorizes action;</tspan><tspan x="1036" dy="22">verify fruit is collected</tspan></text>
</g>
<g fill="#5a7778" font-size="13"><text x="88" y="740">Input data must be validated</text><text x="404" y="740">Detector not yet validated</text><text x="720" y="740">No real actuator control here</text><text x="1036" y="740">Emergency stop remains essential</text></g>
</g>
<rect x="64" y="785" width="1272" height="28" rx="8" fill="#fff1e7"/>
<text x="80" y="804" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a461b">CONCEPT ONLY — not a built or field-tested robot; autonomous climbing, cutting, and safe harvesting are not demonstrated.</text>
</svg>