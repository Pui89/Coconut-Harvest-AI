<text x="1090" y="538" font-family="Arial,sans-serif" font-size="13" fill="#42655b">Approves / stops task</text>
<!-- workflow cards -->
<g font-family="Arial,sans-serif">
<g filter="url(#shadow)">
<rect x="64" y="610" width="296" height="154" rx="16" fill="#f5fafb" stroke="#c8dfe4" stroke-width="2"/>
