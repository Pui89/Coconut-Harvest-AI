 <rect x="55" y="48" width="490" height="116" rx="18" fill="#132b30" opacity=".9"/>
 <text x="82" y="88" fill="#ffffff" font-size="30" font-weight="700">COCONUT HARVEST AI</text>
 <text x="82" y="119" fill="#c9e1d4" font-size="19">Low-cost, slim-arm all-stage concept</text>
 <text x="82" y="145" fill="#f0c56e" font-size="15">ENGINEERING VISUAL • NOT A BUILT ROBOT</text>
 <rect x="60" y="190" width="300" height="190" rx="14" fill="#ffffff" opacity=".94"/>
 <text x="82" y="222" font-size="20" font-weight="700" fill="#20373a">Four maturity stages</text>
 <circle cx="88" cy="250" r="8" fill="#6eac45"/><text x="108" y="256" font-size="17" fill="#2c403d">01  Young Green</text>
 <circle cx="88" cy="280" r="8" fill="#8ebc43"/><text x="108" y="286" font-size="17" fill="#2c403d">02  Developing</text>
 <circle cx="88" cy="310" r="8" fill="#c8b84c"/><text x="108" y="316" font-size="17" fill="#2c403d">03  Mature Green</text>
 <circle cx="88" cy="340" r="8" fill="#895637"/><text x="108" y="346" font-size="17" fill="#2c403d">04  Brown-Aging</text>
 <path d="M360 280L480 280L590 330" fill="none" stroke="#f7f8e9" stroke-width="2.5" stroke-dasharray="6 6"/>
 <rect x="55" y="785" width="890" height="77" rx="14" fill="#152b2d" opacity=".92"/>
 <text x="80" y="816" fill="#ffffff" font-size="18" font-weight="700">Design priorities</text>
 <text x="80" y="843" fill="#d7e5d9" font-size="16">Slim arm • modular mast • low-cost sensors • guarded tool • tracked base + stabilizers</text>
 <rect x="1000" y="752" width="545" height="110" rx="14" fill="#152b2d" opacity=".92"/>
 <text x="1025" y="783" fill="#f4cb77" font-size="18" font-weight="700">Height is not reach</text>
 <text x="1025" y="809" fill="#ffffff" font-size="15">0–6 m: supervised feasibility tests only;</text>
 <text x="1025" y="833" fill="#ffffff" font-size="15">6–30 m: specialized reach and safety unvalidated.</text>
</g>
</svg>