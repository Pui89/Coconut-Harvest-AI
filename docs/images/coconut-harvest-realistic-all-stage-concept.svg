<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Coconut Harvest AI — conceptual harvesting robot with four coconut maturity stages</title>
<desc id="desc">Concept rendering beside a tall coconut palm representing a 0–30 m orchard challenge. The pictured compact tracked robot, jointed telescopic arm and collection basket are concept elements, not to scale and not demonstrated to reach the crown. The four maturity labels are conceptual categories; cultivar-specific visual boundaries and automated classification require validation. Fruit detection, high-reach access, stability, cutting and safe capture are unvalidated.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9bc9df"/><stop offset=".58" stop-color="#d9e9dc"/><stop offset="1" stop-color="#f2e8cf"/></linearGradient>
  <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#87966b"/><stop offset="1" stop-color="#4c6146"/></linearGradient>
  <linearGradient id="trunk" x2="1" y2=".2"><stop stop-color="#4b3328"/><stop offset=".35" stop-color="#926344"/><stop offset=".62" stop-color="#bc8b5c"/><stop offset="1" stop-color="#52392b"/></linearGradient>
  <linearGradient id="metal" x2="1" y2="0"><stop stop-color="#4c5961"/><stop offset=".22" stop-color="#dce3e5"/><stop offset=".5" stop-color="#78868d"/><stop offset=".78" stop-color="#eef2f1"/><stop offset="1" stop-color="#56646a"/></linearGradient>
  <linearGradient id="darkMetal" x2="0" y2="1"><stop stop-color="#34434a"/><stop offset=".55" stop-color="#17262d"/><stop offset="1" stop-color="#45565a"/></linearGradient>
  <linearGradient id="greenFruit" x2="1" y2="1"><stop stop-color="#b3d45b"/><stop offset=".4" stop-color="#5c9a37"/><stop offset="1" stop-color="#2f602e"/></linearGradient>
  <linearGradient id="brownFruit" x2="1" y2="1"><stop stop-color="#b9824d"/><stop offset=".45" stop-color="#87522e"/><stop offset="1" stop-color="#4e3325"/></linearGradient>
  <linearGradient id="yellowFruit" x2="1" y2="1"><stop stop-color="#f0d16a"/><stop offset=".5" stop-color="#b3a43c"/><stop offset="1" stop-color="#6c7730"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <g id="leaf"><path d="M0 0 Q-35 -35 -150 -64 Q-95 -17 -25 5 Q-95 -5 -130 12 Q-68 18 -5 10Z" fill="#2f6b43"/><path d="M0 0 Q-38 -33 -150 -64" fill="none" stroke="#87a65b" stroke-width="2"/><path d="M-24 -7l-38 -27M-47 -2l-37 -25M-70 -7l-36 -24M-92 -17l-33 -22" stroke="#9cba6a" stroke-width="1.5" opacity=".8"/></g>
  <g id="coconutGreen"><ellipse cx="0" cy="0" rx="17" ry="23" fill="url(#greenFruit)" stroke="#3f682f" stroke-width="1.5"/><path d="M-9 -13Q-1 -20 8 -13" fill="none" stroke="#d0e68a" stroke-width="2" opacity=".75"/><path d="M0 17l-4 8 7 -2" fill="#5c7936"/></g>
  <g id="coconutYellow"><ellipse cx="0" cy="0" rx="17" ry="23" fill="url(#yellowFruit)" stroke="#717d35" stroke-width="1.5"/><path d="M-8 -13Q0 -20 8 -12" fill="none" stroke="#f7e6a0" stroke-width="2" opacity=".75"/></g>
  <g id="coconutBrown"><ellipse cx="0" cy="0" rx="17" ry="22" fill="url(#brownFruit)" stroke="#4f3426" stroke-width="1.5"/><path d="M-7 -12Q1 -17 8 -10" fill="none" stroke="#d3a16d" stroke-width="2" opacity=".65"/><path d="M-8 3l13 8M-4 -2l10 6" stroke="#513323" stroke-width="1" opacity=".7"/></g>
</defs>
