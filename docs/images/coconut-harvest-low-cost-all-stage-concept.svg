<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Coconut Harvest AI — low-cost all-stage harvesting robot concept</title>
<desc id="desc">Detailed original engineering concept illustration in a tropical coconut orchard. A compact tracked ground base anchors a slim telescopic mast and lightweight guarded arm beside a 20–30 metre coconut palm. RGB and depth sensors inspect mixed green and brown coconut stages. The design is conceptual and not a photograph or validated robot.</desc>
