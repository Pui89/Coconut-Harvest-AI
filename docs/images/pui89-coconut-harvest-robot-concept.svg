<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Coconut Harvest AI robot — concept visualization</title>
<desc id="desc">A detailed engineering concept illustration of a sensor-equipped agricultural robot inspecting coconuts on a palm tree. This is a concept rendering, not a photograph or evidence of a built robot.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ac8d2"/><stop offset=".55" stop-color="#d8e7d9"/><stop offset="1" stop-color="#f2e8cf"/></linearGradient>
  <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d4938"/><stop offset=".35" stop-color="#887458"/><stop offset=".65" stop-color="#5b513e"/><stop offset="1" stop-color="#393e31"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbfc"/><stop offset=".35" stop-color="#b9cbd0"/><stop offset=".7" stop-color="#647c86"/><stop offset="1" stop-color="#263e4a"/></linearGradient>
  <linearGradient id="darkmetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#334d5b"/><stop offset="1" stop-color="#152b35"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#688c4f"/><stop offset="1" stop-color="#1e503d"/></linearGradient>
  <radialGradient id="coco" cx=".32" cy=".24" r=".8"><stop offset="0" stop-color="#b78a52"/><stop offset=".55" stop-color="#75502f"/><stop offset="1" stop-color="#392e25"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#fff" opacity=".18"/><circle cx="6" cy="5" r=".5" fill="#233" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
