# Advanced model integration for the coconut-harvest embodied-AI stack.
# Model weights are intentionally not bundled in this repository.

version: 1

generative_simulation:
  - name: LTX-2.5-Diffusers
    source: Lightricks/LTX-2.5-Diffusers
    role: video_audio_world_simulation
    uses:
      - orchard_video_generation
      - wind_and_leaf_motion
      - rain_fog_low_light
      - occlusion_and_visibility_variants
      - tool_contact_and_failure_scenarios
      - synthetic_training_data
    runtime_robot_control: false
    license_review_required: true

vision_language_reasoning:
  - name: Gemma-4-31B-it
    source: google/gemma-4-31B-it
    source_url: https://huggingface.co/google/gemma-4-31B-it
    role: multimodal_scene_reasoning_and_task_interpretation
    runtime: transformers_or_vllm
    uses:
      - orchard_image_reasoning
      - target_verification
      - ripeness_and_quality_reasoning
      - occlusion_analysis
      - branch_and_workspace_risk_reasoning
      - active_perception
      - structured_harvest_planning
    input_modalities:
      - text
      - image
    output: structured_decision
    direct_motor_control: false
    safety_gate_required: true
    model_weights_bundled: false

action_models:
  - name: NVIDIA-GR00T-N1.7-3B
    source: nvidia/GR00T-N1.7-3B
    role: embodied_action_policy_candidate
    uses:
      - imitation_learning
      - skill_transfer
      - grasp_approach_cut_retract_candidates
      - simulator_to_real_training
    output: candidate_actions
    direct_motor_control: false
    safety_gate_required: true

  - name: FLUX-3-Action-Base
    source: black-forest-labs/flux-3-action-base
    role: world_action_model_adaptation_base
    uses:
      - camera_state_conditioned_action_prediction
      - future_video_prediction
      - embodiment_adaptation
      - simulator_action_training
    output: candidate_actions_and_future_video
    requires_embodiment_head: true
    direct_motor_control: false
    safety_gate_required: true

integration:
  architecture: >
    RGB/RGB-D/LiDAR/IMU -> YOLO + SAM3 + tracking -> 3D tree/branch/fruit world model
    -> Gemma-4-31B-it reasoning -> active perception + future prediction
    -> GR00T N1.7 / FLUX 3 Action candidate actions -> deterministic safety gate
    -> ROS2/Nav2 + MoveIt2/RRT* -> arm/tool controller -> verify harvest -> memory update

  synthetic_data:
    pipeline: >
      Isaac Sim/Isaac Lab + LTX-2.5
      -> rare-event orchard video/audio -> perception/reasoning/action datasets
      -> LeRobot training and evaluation

safety:
  foundation_models_are_advisory: true
  deterministic_workspace_check: true
  deterministic_collision_check: true
  human_exclusion_check: true
  joint_velocity_and_force_limits: true
  tool_force_and_torque_limits: true
  emergency_stop: true
  human_override_for_high_consequence_uncertainty: true
