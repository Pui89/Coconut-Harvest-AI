# Reference configuration for the embodied-AI pipeline.
# Model weights are intentionally not bundled in this repository.

perception:
  detector:
    framework: ultralytics-yolo26
    model_repo: Ultralytics/YOLO26
    weights: yolo26n.pt
    task: detection
    confidence_threshold: 0.35
    image_size: 640
    runtime: ultralytics + huggingface_hub
    role: fast_coconut_and_tree_visual_proposals
    direct_motor_control: false
  segmentation:
    framework: sam3
    mode: image_and_video
  tracking:
    enabled: true

vision_language:
  model_family: gemma-4-31B-it
  model_id: google/gemma-4-31B-it
  enabled: true
  role: multimodal_scene_reasoning_and_task_interpretation
  runtime: transformers
  image_text_to_text: true

world_model:
  rgbd: true
  lidar: optional
  pointcloud: open3d
  semantic_map: true

action:
  candidates:
    - groot
    - smolvla
    - openvla
    - pi0
  selected: smolvla
  direct_motor_control: false

planning:
  ros2: true
  moveit2: true
  collision_check: true
  planner: rrt_star

safety:
  require_human_exclusion_check: true
  require_collision_check: true
  require_joint_limits: true
  require_confidence_gate: true
  emergency_stop: true

simulation:
  primary: isaac_sim
  learning: isaac_lab
  domain_randomization: true
  sim_to_real: true

advanced_models:
  vision_language_reasoning:
    - google/gemma-4-31B-it
  generative_simulation:
    - LTX-2.5-Diffusers
  action_candidates:
    - NVIDIA-GR00T-N1.7-3B
    - FLUX-3-Action-Base
  direct_motor_control: false
  deterministic_safety_gate: required
